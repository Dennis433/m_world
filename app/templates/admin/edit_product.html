{% extends 'admin/admin_base.html' %}
{% block content %}

<h2 class="fw-bold mb-4">Edit Product</h2>

<div class="card shadow-sm p-4" style="max-width:600px;">
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Shoe Name</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Brand</label>
            <input type="text" name="brand" class="form-control" value="{{ product.brand }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Price ($)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">Stock</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
                <option value="Men"              {% if product.category == 'Men' %}selected{% endif %}>Men</option>
                <option value="Women"            {% if product.category == 'Women' %}selected{% endif %}>Women</option>
                <option value="Kids"             {% if product.category == 'Kids' %}selected{% endif %}>Kids</option>
                <option value="Unisex/Sneakers"  {% if product.category == 'Unisex/Sneakers' %}selected{% endif %}>Unisex/Sneakers</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Available Sizes <small class="text-muted">(comma separated e.g. 40,41,42,43)</small></label>
            <input type="text" name="sizes" class="form-control" value="{{ product.sizes }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Product Image <small class="text-muted">(leave blank to keep current)</small></label>
            <div class="mb-2">
                <img src="{{ url_for('static', filename='images/' + product.image_file) }}"
                     width="100" height="100" style="object-fit:cover; border-radius:8px;">
            </div>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn btn-dark w-100">Save Changes</button>
        <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
    </form>
</div>

{% endblock %}
