{% extends 'admin/admin_base.html' %}
{% block content %}

<h2 class="fw-bold mb-4">Add New Product</h2>

<div class="card shadow-sm p-4" style="max-width:600px;">
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Shoe Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Brand</label>
            <input type="text" name="brand" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Price ($)</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">Stock</label>
                <input type="number" name="stock" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
                <option value="">-- Select Category --</option>
                <option value="Men">Men</option>
                <option value="Women">Women</option>
                <option value="Kids">Kids</option>
                <option value="Unisex/Sneakers">Unisex/Sneakers</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Available Sizes <small class="text-muted">(comma separated e.g. 40,41,42,43)</small></label>
            <input type="text" name="sizes" class="form-control" placeholder="40,41,42,43,44" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Product Image</label>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn btn-dark w-100">Add Product</button>
    </form>
</div>

{% endblock %}
